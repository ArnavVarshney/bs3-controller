<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>BS3 WebHID smoke test</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; }
  button { margin: 2px; padding: 6px 12px; }
  pre { background: #f4f4f4; padding: 1em; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>BS3 WebHID smoke test</h1>
<p>Chrome/Edge, served over http://localhost (not file://). USB-C <b>data</b>
cable to the laptop. <b>Stop bs3-web first</b> — one process must own the pad.</p>
<div>
  <button id="connect">Connect USB (WebHID)</button>
  <button id="connectBle">Connect BLE (WebBluetooth, Win/Mac)</button>
  <button id="listen" disabled>Listen 3s (no writes)</button>
  <button id="status" disabled>Status</button>
  <button id="info" disabled>FW + supply + gears</button>
  <button id="spin" disabled>Realtime 2000</button>
  <button id="release" disabled>Release</button>
  <label><input type="checkbox" id="dbg" checked> raw traffic log</label>
</div>
<pre id="log">not connected</pre>
<script src="./protocol.js?v=0.2"></script>
<script src="./hid.js?v=0.2"></script>
<script src="./gatt.js?v=0.3"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = (m) => { $("log").textContent += "\n" + m; };
let cooler = null;

$("connect").onclick = async () => {
  try {
    cooler = await HidCooler.request();
    cooler.debug = (m) => { if ($("dbg").checked) log("DBG " + JSON.stringify(m)); };
    log("open: " + cooler.label);
    log("collections: " + JSON.stringify(cooler.device.collections, (k, v) => typeof v === "bigint" ? Number(v) : v));
    for (const id of ["listen", "status", "info", "spin", "release"]) $(id).disabled = false;
  } catch (e) { log("connect FAILED: " + e.message); }
};
$("connectBle").onclick = async () => {
  try {
    cooler = await GattCooler.request();
    cooler.debug = (m) => { if ($("dbg").checked) log("DBG " + JSON.stringify(m)); };
    log("open: " + cooler.label);
    for (const id of ["listen", "status", "info", "spin", "release"]) $(id).disabled = false;
  } catch (e) { log("ble connect FAILED: " + e.message); }
};
$("listen").onclick = async () => {
  try {
    const before = cooler._rxRaw;
    await new Promise((r) => setTimeout(r, 3000));
    log(`listen: ${cooler._rxRaw - before} raw input reports in 3s (wrote nothing)`);
  } catch (e) { log("listen FAILED: " + e.message); }
};
$("status").onclick = async () => {
  try {
    const s = await cooler.statusPush();
    log(`mode=${s.asleep ? "asleep" : s.realtime ? "realtime" : "gear"} cur=${s.currentRpm} tgt=${s.targetRpm} gear=${s.gear} supply=${s.supplyName} seq=${s.seq}`);
  } catch (e) { log("status FAILED: " + e.message); }
};
$("info").onclick = async () => {
  try {
    log("fw=" + await cooler.fwVersion() + " supply=" + await cooler.supplyLevel() +
      " gears=" + JSON.stringify(await cooler.gearTable()));
  } catch (e) { log("info FAILED: " + e.message); }
};
$("spin").onclick = async () => {
  try {
    const supply = await cooler.supplyLevel();
    log("sent=" + await cooler.setRealtimeRpm(2000, supply, "BS3") + " rpm (supply " + supply + ")");
  } catch (e) { log("spin FAILED: " + e.message); }
};
$("release").onclick = async () => {
  try { await cooler.releaseToGear(); log("released to gear"); }
  catch (e) { log("release FAILED: " + e.message); }
};
</script>
</body>
</html>
