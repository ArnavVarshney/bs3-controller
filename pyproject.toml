[project]
name = "bs3-controller"
version = "0.3.0"
description = "Open-source Linux controller for Flydigi BS3 / BS3 Pro laptop coolers (no Space Station needed)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["flydigi", "cooler", "fan-control", "rgb", "hidraw", "bluetooth"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = [
]

[project.optional-dependencies]
gatt = ["dbus-next>=2.4"]  # only for --transport gatt (unpaired BLE via BlueZ)
ble = ["bleak>=1.0"]  # for --transport ble (BLE GATT anywhere: Windows/macOS/Linux)
tray = ["pystray>=0.19", "pillow>=10"]  # for bs3-web --tray (Windows tray icon)
dev = ["pytest", "pillow>=10"]  # pillow: test_tray builds the icon (pystray itself is stubbed)

[project.scripts]
bs3ctl = "bs3.controller_cli:main"
bs3-web = "bs3.webapp:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Dashboard static files MUST ship: bs3-web serves src/bs3/web/ at runtime.
# Without this, wheels/sdists omit them and a pip install 404s on "/".
[tool.setuptools.package-data]
bs3 = ["web/*"]
