name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: python -m pytest tests/ -q

  js-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: node launcher/protocol.test.js
      - run: node launcher/rgb.test.js
      - run: node launcher/device.test.js
      - run: node --check launcher/protocol.js && node --check launcher/rgb.js && node --check launcher/hid.js && node --check launcher/gatt.js && node --check launcher/device.js && node --check launcher/app.js
